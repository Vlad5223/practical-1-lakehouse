services:
  # ---------- MinIO: S3-совместимое объектное хранилище ----------
  minio:
    image: pgsty/silo:latest
    container_name: lakehouse-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- PostgreSQL: база метаданных Lakekeeper ----------
  postgres:
    image: mirror.gcr.io/library/postgres:16
    container_name: lakehouse-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- Lakekeeper: Iceberg REST Catalog ----------
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.3
    container_name: lakekeeper
    ports:
      - "8181:8181"
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "This-is-NOT-Secure-change-me"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://postgres:postgres@postgres:5432/postgres"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://postgres:postgres@postgres:5432/postgres"
      LAKEKEEPER__AUTHZ_BACKEND: "allowall"
      LAKEKEEPER__SKIP_STORAGE_VALIDATION: "true"
      LAKEKEEPER__ENABLE_DEFAULT_PROJECT: "true"
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  # ---------- Trino: SQL-движок ----------
  trino:
    image: trinodb/trino:476
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc/catalog:/etc/trino/catalog
    depends_on:
      - minio
    restart: unless-stopped

  # ---------- Superset: BI поверх Trino/Iceberg ----------
  superset:
    image: apache/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "change-me"
    depends_on:
      - trino
    restart: unless-stopped

volumes:
  minio-data:
  pg-data: